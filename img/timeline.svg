<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#ffffff"/>
  <style>
    .title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 28px; fill: #d32f2f; text-anchor: middle; }
    .subtitle { font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 16px; fill: #555555; text-anchor: middle; }
    .year { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; fill: #d32f2f; }
    .desc { font-family: 'Open Sans', sans-serif; font-size: 14px; fill: #333333; }
    .line { stroke: #d32f2f; stroke-width: 4; stroke-linecap: round; }
    .dot { fill: #d32f2f; stroke: #ffffff; stroke-width: 3; }
  </style>
  <text x="500" y="50" class="title">DALAL &amp; BROACHA MILESTONES</text>
  <text x="500" y="80" class="subtitle">Over Five Decades of Trust, Integrity &amp; Sustainable Growth</text>
  
  <!-- Central Timeline Line -->
  <line x1="500" y1="120" x2="500" y2="550" class="line" />

  <!-- Milestone 1961 -->
  <circle cx="500" cy="140" r="10" class="dot" />
  <line x1="500" y1="140" x2="350" y2="140" stroke="#d32f2f" stroke-width="2" stroke-dasharray="4"/>
  <text x="330" y="135" class="year" text-anchor="end">1961</text>
  <text x="330" y="155" class="desc" text-anchor="end">Established on Bombay Stock Exchange</text>

  <!-- Milestone 1994 -->
  <circle cx="500" cy="220" r="10" class="dot" />
  <line x1="500" y1="220" x2="650" y2="220" stroke="#d32f2f" stroke-width="2" stroke-dasharray="4"/>
  <text x="670" y="215" class="year" text-anchor="start">1994</text>
  <text x="670" y="235" class="desc" text-anchor="start">Corporate Membership of BSE</text>

  <!-- Milestone 2000 -->
  <circle cx="500" cy="300" r="10" class="dot" />
  <line x1="500" y1="300" x2="350" y2="300" stroke="#d32f2f" stroke-width="2" stroke-dasharray="4"/>
  <text x="330" y="295" class="year" text-anchor="end">2000</text>
  <text x="330" y="315" class="desc" text-anchor="end">NSE Membership &amp; Depository Participant</text>

  <!-- Milestone 2006 -->
  <circle cx="500" cy="380" r="10" class="dot" />
  <line x1="500" y1="380" x2="650" y2="380" stroke="#d32f2f" stroke-width="2" stroke-dasharray="4"/>
  <text x="670" y="375" class="year" text-anchor="start">2006</text>
  <text x="670" y="395" class="desc" text-anchor="start">Launch of Portfolio Management Services (PMS)</text>

  <!-- Milestone Present -->
  <circle cx="500" cy="460" r="10" class="dot" />
  <line x1="500" y1="460" x2="350" y2="460" stroke="#d32f2f" stroke-width="2" stroke-dasharray="4"/>
  <text x="330" y="455" class="year" text-anchor="end">TODAY</text>
  <text x="330" y="475" class="desc" text-anchor="end">Serving 20,000+ Clients Pan-India</text>
</svg>
